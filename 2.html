<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apple Music Player</title>
<style>
:root { --primary-text: rgba(255,255,255,1); --secondary-text: rgba(255,255,255,0.5); --blur-radius: 120px; --glass-bg: rgba(0,0,0,0.2); --glass-blur: blur(40px) saturate(200%); }
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
body { background:#000; color:white; overflow:hidden; height:100vh; }
.ambient-bg { position:fixed; top:-50%; left:-50%; width:200%; height:200%; z-index:0; pointer-events:none; background:#111; }
.orb { position:absolute; border-radius:50%; filter:blur(var(--blur-radius)); opacity:0.8; animation:float 20s infinite alternate cubic-bezier(0.4,0,0.2,1); transition:background-color 2s ease; }
.orb-1 { width:60vw; height:60vw; top:20%; left:20%; background:#ff2a5f; animation-delay:0s; }
.orb-2 { width:70vw; height:70vw; bottom:20%; right:10%; background:#e5989b; animation-delay:-5s; }
.orb-3 { width:50vw; height:50vw; top:40%; left:50%; background:#6b2d5c; animation-delay:-10s; }
@keyframes float { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(10%,-15%) scale(1.1)} 66%{transform:translate(-10%,15%) scale(0.9)} 100%{transform:translate(15%,5%) scale(1.2)} }
.player-container { position:relative; z-index:10; height:100vh; background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); transition:backdrop-filter .5s,background .5s; }

/* 搜索条 - 始终可见 */
.top-search { position:absolute; top:0; left:0; right:0; z-index:60; padding:16px 30px; display:flex; gap:10px; align-items:center; }
.top-search input { flex:1; max-width:400px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); border-radius:30px; padding:10px 18px; color:white; font-size:14px; outline:none; }
.top-search input:focus { border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.12); }
.top-search input::placeholder { color:rgba(255,255,255,.25); }
.top-search select { background:rgba(255,255,255,.1); border:none; color:rgba(255,255,255,.6); padding:8px 12px; border-radius:20px; font-size:12px; cursor:pointer; outline:none; }
.top-search .btn { background:rgba(255,255,255,.1); border:none; color:rgba(255,255,255,.6); padding:8px 14px; border-radius:20px; font-size:12px; cursor:pointer; backdrop-filter:blur(10px); transition:all .2s; }
.top-search .btn:hover { background:rgba(255,255,255,.2); color:white; }

/* 搜索结果浮层 - 半透明浮在播放器上面 */
.search-results-panel { position:absolute; top:60px; left:30px; right:30px; z-index:55; max-height:40vh; overflow-y:auto; background:rgba(0,0,0,.6); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); border-radius:20px; border:1px solid rgba(255,255,255,.06); display:none; padding:8px; }
.search-results-panel.show { display:block; }
.search-results-panel::-webkit-scrollbar { display:none; }
.search-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; cursor:pointer; transition:background .2s; }
.search-item:hover { background:rgba(255,255,255,.08); }
.search-item-info { flex:1; min-width:0; }
.search-item-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-item-artist { font-size:11px; color:rgba(255,255,255,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

/* 左图右词 */
#force-apple-layout { display:flex !important; flex-direction:row !important; position:absolute !important; top:70px !important; bottom:100px !important; left:0 !important; right:0 !important; align-items:center !important; justify-content:center !important; padding:0 8vw !important; gap:4vw !important; z-index:10 !important; }
#force-left-cover { flex:1 !important; display:flex !important; justify-content:flex-end !important; align-items:center !important; }
.super-apple-cover { width:42vh !important; height:42vh !important; min-width:280px !important; min-height:280px !important; border-radius:24px !important; box-shadow:0 30px 80px rgba(0,0,0,0.6) !important; object-fit:cover !important; z-index:20 !important; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
.super-apple-cover:hover { transform:scale(1.03); }
#force-right-lyrics { flex:1.2 !important; height:100% !important; display:flex !important; flex-direction:column !important; justify-content:center !important; overflow:hidden !important; }
#lyrics-container { height:100%; overflow-y:auto; scroll-behavior:smooth; mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%); -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%); }
#lyrics-container::-webkit-scrollbar { display:none; }
.lyric-line { margin-bottom:35px; transform-origin:left center; transition:all .6s cubic-bezier(.25,.1,.25,1); opacity:.25; filter:blur(1.5px); transform:scale(.92); cursor:pointer; }
.lyric-line:hover { opacity:.6; filter:blur(0); }
.lyric-line.active { opacity:1; filter:blur(0); transform:scale(1); text-shadow:0 0 20px rgba(255,255,255,.3); }
.lyric-line.active .primary-lyric { background:linear-gradient(90deg,#fff 0%,#fff 50%,rgba(255,255,255,.5) 50%,rgba(255,255,255,.5) 100%); background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shimmer 4s linear infinite; }
@keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
.primary-lyric { font-size:3rem; font-weight:800; letter-spacing:-1px; line-height:1.2; color:var(--primary-text); }
.translation-lyric { font-size:1.2rem; font-weight:600; color:var(--secondary-text); margin-top:6px; transition:color .6s; }
.lyric-line.active .translation-lyric { color:rgba(255,255,255,.85); }

/* 底部播放条 */
.apple-bottom-bar { height:80px; width:100%; display:flex; align-items:center; padding:0 6vw; gap:20px; background:transparent; position:absolute; bottom:0; left:0; }
.apple-play-btn { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.12); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; color:white; transition:all .2s; flex-shrink:0; }
.apple-play-btn:hover { background:rgba(255,255,255,.22); transform:scale(1.05); }
.apple-progress-container { flex:1; height:5px; background:rgba(255,255,255,.15); border-radius:4px; position:relative; cursor:pointer; }
.apple-progress-fill { height:100%; width:0%; background:white; border-radius:4px; transition:width .1s linear; }
.time-display { font-size:11px; color:rgba(255,255,255,.3); font-variant-numeric:tabular-nums; min-width:80px; text-align:center; }

input[type="file"] { display:none; }
</style>
</head>
<body>

<div class="ambient-bg">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="orb orb-3" id="orb3"></div>
</div>

<div class="player-container" id="glass-container">

    <!-- 顶部搜索条（始终可见） -->
    <div class="top-search">
        <input id="searchInput" placeholder="搜索音乐..." autocomplete="off">
        <select id="sourceSelect">
            <option value="netease">网易</option>
            <option value="kuwo">酷我</option>
            <option value="joox">JOOX</option>
        </select>
        <button class="btn" onclick="document.getElementById('audio-upload').click()">本地</button>
        <button class="btn" onclick="toggleGlassMode()">毛玻璃</button>
        <input type="file" id="audio-upload" accept="audio/*">
        <input type="file" id="lrc-upload" accept=".lrc,.txt">
    </div>

    <!-- 搜索结果浮层（半透明浮在封面歌词之上） -->
    <div class="search-results-panel" id="searchPanel"></div>

    <!-- 左图右词 -->
    <div id="force-apple-layout">
        <div id="force-left-cover">
            <img id="album-art" class="super-apple-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=2070&auto=format&fit=crop" crossorigin="anonymous" alt="Album">
        </div>
        <div id="force-right-lyrics">
            <div id="lyrics-container" style="padding-top:25vh; padding-bottom:25vh;">
                <div class="lyric-line active" style="text-align:center;">
                    <div class="primary-lyric">Apple Music</div>
                    <div class="translation-lyric">在上方搜索音乐</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部播放条 -->
    <div class="apple-bottom-bar">
        <span class="time-display" id="timeCurrent">0:00</span>
        <div class="apple-progress-container" id="progress-container">
            <div class="apple-progress-fill" id="progress-bar"></div>
        </div>
        <span class="time-display" id="timeTotal" style="text-align:left">0:00</span>
        <button class="apple-play-btn" onclick="togglePlay()">
            <svg id="play-icon" style="width:20px;height:20px;fill:currentColor;margin-left:3px;" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
    </div>
</div>

<script>
const GD_API = 'https://music-api.gdstudio.xyz/api.php';
const API_BASE = 'http://localhost:4000/api';
const audio = new Audio();
let lyricsData = [];
let currentLineIndex = -1;

const $ = id => document.getElementById(id);
const els = {
    lc: $('lyrics-container'),
    art: $('album-art'),
    bar: $('progress-bar'),
    prog: $('progress-container'),
    icon: $('play-icon'),
    glass: $('glass-container'),
    cur: $('timeCurrent'),
    tot: $('timeTotal'),
};

function fmt(s) { if (!s||isNaN(s)) return '0:00'; var m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }

// ===== 搜索 =====
let timer;
$('searchInput').addEventListener('input', function() {
    clearTimeout(timer);
    const q = this.value.trim();
    if (!q) { $('searchPanel').classList.remove('show'); return; }
    timer = setTimeout(() => search(q), 350);
});

async function search(keyword) {
    const src = $('sourceSelect').value;
    $('searchPanel').classList.add('show');
    $('searchPanel').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.3);font-size:13px;">搜索中...</div>';
    try {
        const r = await fetch(GD_API+'?types=search&source='+src+'&name='+encodeURIComponent(keyword)+'&count=15&pages=1');
        const d = await r.json();
        if (!Array.isArray(d)||!d.length) { $('searchPanel').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.3);font-size:13px;">无结果</div>'; return; }
        $('searchPanel').innerHTML = d.map(i => `
            <div class="search-item" onclick="play('${i.id}','${src}','${i.pic_id}','${i.lyric_id}')">
                <div style="width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.05);flex-shrink:0;display:flex;align-items:center;justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="rgba(255,255,255,.3)"><polygon points="5,3 19,12 5,21"/></svg>
                </div>
                <div class="search-item-info">
                    <div class="search-item-title">${i.name}</div>
                    <div class="search-item-artist">${(i.artist||[]).join(' / ')}</div>
                </div>
            </div>
        `).join('');
    } catch(e) { $('searchPanel').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.3);font-size:13px;">请求失败</div>'; }
}

document.addEventListener('click', function(e) {
    if (!$('searchPanel').contains(e.target) && e.target.id !== 'searchInput') $('searchPanel').classList.remove('show');
});

async function play(id, src, picId, lyricId) {
    $('searchPanel').classList.remove('show');
    $('searchInput').blur();
    $('lc').innerHTML = '<div class="lyric-line active" style="text-align:center;"><div class="primary-lyric">加载中...</div></div>';

    const [urlR, picR] = await Promise.all([
        fetch(GD_API+'?types=url&source='+src+'&id='+id+'&br=320'),
        fetch(GD_API+'?types=pic&source='+src+'&id='+picId+'&size=500')
    ]);
    const urlD = await urlR.json();
    const picD = await picR.json();

    if (urlD.url) { audio.src = urlD.url; audio.load(); audio.play(); }
    if (picD.url) { els.art.src = picD.url; els.art.onload = () => extractColors(els.art); }

    fetch(GD_API+'?types=lyric&source='+src+'&id='+lyricId)
        .then(r => r.json())
        .then(d => { if (d.lyric) { lyricsData = parseLRC(d.tlyric ? d.lyric+'\n'+d.tlyric : d.lyric); currentLineIndex=-1; renderLyrics(); } });
}

// ===== 歌词 =====
function parseLRC(text) {
    const lines = text.split('\n'), out = [];
    const re = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
    let last = null;
    lines.forEach(line => {
        const m = re.exec(line);
        if (!m) return;
        const t = parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3].padEnd(3,'0'))/1000;
        const txt = m[4].trim();
        if (!txt) return;
        const cn = /[\u4e00-\u9fa5]/.test(txt);
        if (out.length && Math.abs(out[out.length-1].time-t) < 0.1) { out[out.length-1].translation = txt; }
        else if (last && cn && !/[a-zA-Z]/.test(txt) && t-last.time < 1) { last.translation = txt; }
        else { const e = {time:t,text:txt,translation:''}; out.push(e); last = e; }
    });
    return out.sort((a,b) => a.time - b.time);
}

function renderLyrics() {
    els.lc.innerHTML = '';
    lyricsData.forEach((l,i) => {
        const d = document.createElement('div');
        d.className = 'lyric-line'; d.id = 'line-'+i;
        d.innerHTML = '<div class="primary-lyric">'+l.text+'</div>' + (l.translation ? '<div class="translation-lyric">'+l.translation+'</div>' : '');
        d.onclick = () => { audio.currentTime = l.time; };
        els.lc.appendChild(d);
    });
}

audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
        els.bar.style.width = (audio.currentTime/audio.duration*100) + '%';
        els.cur.textContent = fmt(audio.currentTime);
        els.tot.textContent = fmt(audio.duration);
    }
    let idx = -1;
    for (let i=0; i<lyricsData.length; i++) { if (audio.currentTime >= lyricsData[i].time) idx = i; else break; }
    if (idx !== -1 && idx !== currentLineIndex) {
        if (currentLineIndex !== -1) { const o = $('line-'+currentLineIndex); if (o) o.classList.remove('active'); }
        currentLineIndex = idx;
        const n = $('line-'+currentLineIndex);
        if (n) {
            n.classList.add('active');
            els.lc.scrollTo({ top: n.offsetTop - els.lc.clientHeight/2 + n.clientHeight/2, behavior: 'smooth' });
        }
    }
});

audio.addEventListener('ended', () => { els.icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; });

function togglePlay() {
    if (audio.paused && audio.src) { audio.play(); els.icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'; }
    else { audio.pause(); els.icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
}

els.prog.addEventListener('click', e => {
    if (!audio.duration) return;
    audio.currentTime = (e.offsetX / els.prog.offsetWidth) * audio.duration;
});

function extractColors(img) {
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    c.width = img.naturalWidth||450; c.height = img.naturalHeight||450;
    ctx.drawImage(img,0,0,c.width,c.height);
    const avg = (x,y,w,h) => { const d=ctx.getImageData(x,y,w,h).data; let r=0,g=0,b=0,ct=0; for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];ct++;} return 'rgb('+~~(r/ct)+','+~~(g/ct)+','+~~(b/ct)+')'; };
    $('orb1').style.background = avg(0,0,c.width/2,c.height/2);
    $('orb2').style.background = avg(c.width/2,0,c.width/2,c.height/2);
    $('orb3').style.background = avg(0,c.height/2,c.width,c.height/2);
}

let gm = 0;
function toggleGlassMode() {
    const ms = [{ bg:'rgba(0,0,0,0.2)', filter:'blur(40px) saturate(200%)' }, { bg:'rgba(255,255,255,0.05)', filter:'blur(60px) saturate(250%)' }, { bg:'rgba(0,0,0,0.6)', filter:'blur(20px) saturate(100%)' }];
    gm = (gm+1)%3;
    els.glass.style.background = ms[gm].bg;
    els.glass.style.backdropFilter = ms[gm].filter;
    els.glass.style.webkitBackdropFilter = ms[gm].filter;
}

$('audio-upload').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    audio.src = URL.createObjectURL(f); audio.play();
});

$('lrc-upload').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { lyricsData = parseLRC(ev.target.result); currentLineIndex = -1; renderLyrics(); };
    r.readAsText(f);
});

async function loadMusic(musicId) {
    try {
        const r = await fetch(API_BASE + '/music/' + musicId);
        if (!r.ok) return;
        const d = await r.json();
        if (d.coverUrl) { els.art.src = d.coverUrl; els.art.onload = () => extractColors(els.art); }
        if (d.audioUrl) { audio.src = d.audioUrl; audio.load(); audio.play(); }
    } catch(e) { console.error(e); }
}

async function loadLyrics(musicId) {
    try {
        const r = await fetch(API_BASE + '/lyrics/' + musicId);
        if (!r.ok) return;
        const d = await r.json();
        if (d.content) { lyricsData = parseLRC(d.content); currentLineIndex = -1; renderLyrics(); }
    } catch(e) { console.error(e); }
}

console.log('[Ready]');
</script>
</body>
</html>
